# The sources the kit builds, pinned: name, version, url, commit or sha256.
# A git+ URL pins a commit (the last column), a docker: URL an image digest,
# any other URL a file's SHA-256. Bump a line, then rebuild.
#
# AVM (the AV2 reference codec): our release, not an upstream one, picked
# from the fork's integration-avm (upstream main + feature-avm-rt) once it
# passes test.sh. A local build takes SRC_avm=<checkout> (README, "Local
# sources").
#
# name        version     url                                       commit / sha256
avm           20261104.2  git+https://github.com/congzhangzh/avm.git e2969605549d11b9609b8f678fbb8de09ec4fc34
#
# The WebAssembly toolchain, the same image rdp-release-kit builds its web
# client with, so libavm links into that client unchanged.
emsdk         6.0.13    docker:emscripten/emsdk                       sha256:fb7864e398acfda863dfcea78b8bc8adad359fa60c6a0bbeb845931de64aa68a
#
# The Windows toolchain: llvm-mingw (clang, lld, the UCRT), the release
# rdp-release-kit builds its Windows client with. It publishes no checksums:
# the hash is the one of the copy rdp-release-kit downloaded on 2026-10-21
# (trust on first use; it equals the digest GitHub shows for the asset).
llvm_mingw    20261020  https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
# The Windows build container around it (CMake, Ninja, ccache, nasm, wine for
# the decode test): Debian 13 by the digest of its multi-arch index.
debian        13        docker:debian                                 sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
#
# Intel's Software Development Emulator, for simd.sh on CI runners whose CPU
# has no AVX-512 (only there: never on a developer's machine). The copy
# vendored in petarpetrovt/setup-sde at a pinned commit; its SHA-256 is the
# one Intel publishes for this release.
sde           10.13.1   https://github.com/petarpetrovt/setup-sde/raw/6d2773bc0ef3005fd52e0ae0bb91782321793aec/binaries/sde-external-10.13.1-2026-07-28-lin.tar.xz 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
